[project]
name = "rag-build"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Biresh Kumar Mishra", email = "mishrabiresh@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.15.0",
    "chromadb>=1.5.9",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.21.0",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
    "voyageai>=0.5.0",
]

[project.scripts]
rag-build = "rag_build:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
